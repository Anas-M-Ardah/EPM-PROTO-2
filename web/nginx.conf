server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # The Angular router owns the URL space. Anything that is not a real file
    # is answered with index.html, so a deep link or a refresh on
    # /projects/PRJ-001/boq loads the app instead of 404ing.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Hashed build assets (outputHashing: all) can never go stale.
    location ~* \.(?:js|css|woff2?|png|jpg|svg)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # index.html must not be cached, or a deploy keeps serving the old hashes.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Same-origin API — see environment.docker.ts. `api` is the compose
    # service name; 8080 is ASPNETCORE_HTTP_PORTS inside that container.
    location /api/ {
        proxy_pass http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # BOQ and schedule imports post spreadsheets; the default 1m is tight.
        client_max_body_size 25m;
        proxy_read_timeout   120s;
    }
}
