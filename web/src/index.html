<!doctype html>
<!-- Arabic RTL is the primary direction (05 §5.1). core/lang.ts flips lang+dir at runtime. -->
<html lang="ar" dir="rtl" data-theme="light">
<head>
  <meta charset="utf-8">
  <title>EPM — نظام إدارة المشاريع الهندسية</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- The product mark, same asset the reference uses (brand/epm-favicon.svg).
       The .ico stays as the fallback for browsers that will not take an SVG. -->
  <link rel="icon" type="image/svg+xml" href="brand/epm-favicon.svg">
  <link rel="alternate icon" type="image/x-icon" href="favicon.ico">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <!--
    v1.1 (05 §2): Cairo (Arabic UI) · Inter (Latin UI) · IBM Plex Mono (figures, tabular-nums).

    tokens.css declares `--font-en: 'Inter'`, so Inter is what we load. The
    reference branch's own index.html still loads Roboto and never loads Inter,
    so its Latin text silently falls back to system-ui — a defect in the branch,
    not a choice. Recorded as P-20.
  -->
  <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;500;600;700&family=Inter:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
</head>
<body>
  <app-root></app-root>
</body>
</html>
