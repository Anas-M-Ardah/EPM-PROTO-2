<!doctype html>
<!-- Arabic RTL is the primary direction (05 §5.1). core/lang.ts flips lang+dir at runtime. -->
<html lang="ar" dir="rtl" data-theme="light">
<head>
  <meta charset="utf-8">
  <title>EPM — نظام إدارة المشاريع الهندسية</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- The product mark — byte-identical to the reference's own asset, and the
       ONLY icon declared, exactly as the reference declares it.

       There was an `alternate icon` here pointing at public/favicon.ico. That
       file was Angular's default purple shield, left over from the scaffold,
       and it is what actually showed: a browser requests /favicon.ico by
       convention whether or not an SVG is declared, and the cached .ico won.
       The reference ships no .ico (it 404s), so neither do we. -->
  <link rel="icon" type="image/svg+xml" href="brand/epm-favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <!--
    v1.1 (05 §2): Cairo (Arabic UI) · Inter (Latin UI) · IBM Plex Mono (figures, tabular-nums).

    tokens.css declares `--font-en: 'Inter'`, so Inter is what we load. The
    reference branch's own index.html still loads Roboto and never loads Inter,
    so its Latin text silently falls back to system-ui — a defect in the branch,
    not a choice. Recorded as P-20.
  -->
  <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;500;600;700&family=Inter:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
</head>
<body>
  <app-root></app-root>
</body>
</html>
